<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VCollect</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="wordmark">VCOLLECT</h1>
    <form id="add-form" class="add-form">
      <input id="add-url" type="url" placeholder="Add a link" required aria-label="Add a link">
      <button class="button secondary" type="submit">Add</button>
    </form>
    <nav class="menu">
      <button id="sync" class="button" type="button" disabled>Sync</button>
      <div id="progress" class="progress" hidden>
        <div class="progress-row">
          <progress id="progress-bar" max="1" value="0"></progress>
          <button id="cancel" class="link-button" type="button">Cancel</button>
        </div>
        <p id="progress-label" class="progress-label"></p>
      </div>
      <button id="menu-button" class="button secondary menu-button" type="button"
              popovertarget="menu-panel" aria-label="Menu">☰</button>
      <div id="menu-panel" class="menu-panel" popover>
        <label class="toggle">
          <input type="checkbox" id="group-by-date">
          Group by date
        </label>
        <label class="toggle">
          <input type="checkbox" id="auto-pull">
          <span id="auto-pull-label">Pull from Notion every 5 min</span>
        </label>
        <div class="disk">
          <div class="disk-row">
            <span>Storage</span>
            <span id="disk-text"></span>
          </div>
          <meter id="disk-meter" min="0" max="1" value="0"></meter>
          <p id="disk-note" class="disk-note"></p>
        </div>
      </div>
    </nav>
  </header>

  <main class="page">
    <input id="search" class="search" type="search" placeholder="Search your collection"
           autocomplete="off" aria-label="Search">
    <div class="tag-bar">
      <div id="tags-notion" class="tags" aria-label="Tags"></div>
      <div id="tags-ai" class="tags" aria-label="AI tags"></div>
    </div>
    <details id="report" class="report" hidden>
      <summary id="report-summary"></summary>
      <ul id="report-problems"></ul>
    </details>
    <div id="grid"></div>
    <p id="no-match" class="no-match" hidden>Nothing matches.</p>
    <section id="empty" class="empty" hidden>
      <p class="empty-title">No videos yet.</p>
      <ul id="services" class="services"></ul>
    </section>
  </main>

  <dialog id="player" class="player" aria-label="Post">
    <div class="player-media">
      <div id="player-stage" class="player-stage"></div>
      <button id="player-prev" class="player-nav prev" type="button" aria-label="Previous">‹</button>
      <button id="player-next" class="player-nav next" type="button" aria-label="Next">›</button>
      <span id="player-count" class="player-count"></span>
    </div>
    <aside class="player-info">
      <button id="player-close" class="player-close" type="button" aria-label="Close">×</button>
      <div id="player-view">
        <h2 id="player-title" class="player-title"></h2>
        <p id="player-meta" class="player-meta"></p>
        <p id="player-summary" class="player-summary"></p>
        <p id="player-caption" class="player-caption"></p>
        <div id="player-tags" class="tags"></div>
        <div id="player-ai-tags" class="tags"></div>
        <p id="player-state" class="player-state"></p>
        <p class="player-links">
          <a id="player-original" target="_blank" rel="noopener">Open original</a>
          <a id="player-notion" target="_blank" rel="noopener">Open in Notion</a>
        </p>
        <div class="player-actions">
          <button id="player-edit" class="button secondary" type="button">Edit</button>
          <button id="player-readd" class="button secondary" type="button">Re-add to Notion</button>
          <button id="player-delete" class="link-button danger" type="button">Delete</button>
        </div>
      </div>
      <form id="player-editor" class="editor" hidden></form>
    </aside>
  </dialog>

  <dialog id="deleted" class="deleted" aria-labelledby="deleted-title">
    <form method="dialog">
      <h2 id="deleted-title" class="deleted-title"></h2>
      <p class="deleted-help">Ticked posts are deleted here too. Unticked ones stay in the
        gallery, marked "Not in Notion".</p>
      <div id="deleted-tiles" class="deleted-tiles"></div>
      <div class="deleted-actions">
        <button id="deleted-all" class="link-button" type="button">Untick all</button>
        <button class="button secondary" value="cancel">Cancel</button>
        <button id="deleted-go" class="button" value="go"></button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" popover="manual"></div>
</body>
</html>
